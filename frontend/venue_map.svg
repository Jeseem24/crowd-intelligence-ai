<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <rect width="600" height="600" fill="#0f172a" />
  <!-- Gate A -->
  <polygon id="gate_a" points="50,50 250,50 250,200 50,200" fill="#059669" stroke="#10b981" stroke-width="2" opacity="0.85"/>
  <text x="100" y="130" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold">Main Gate A</text>

  <!-- Gate B -->
  <polygon id="gate_b" points="300,50 500,50 500,200 300,200" fill="#059669" stroke="#10b981" stroke-width="2" opacity="0.85"/>
  <text x="340" y="130" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold">Gate B</text>

  <!-- Transit Corridor B -->
  <polygon id="corridor_b" points="150,220 400,220 400,380 150,380" fill="#059669" stroke="#10b981" stroke-width="2" opacity="0.85"/>
  <text x="220" y="300" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold">Corridor B</text>

  <!-- Exit C -->
  <polygon id="exit_c" points="50,400 200,400 200,550 50,550" fill="#059669" stroke="#10b981" stroke-width="2" opacity="0.85"/>
  <text x="80" y="480" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold">Exit C</text>

  <!-- Open Gathering Ground E -->
  <polygon id="ground_e" points="220,400 550,400 550,550 220,550" fill="#059669" stroke="#10b981" stroke-width="2" opacity="0.85"/>
  <text x="320" y="480" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold">Ground E</text>
</svg>
